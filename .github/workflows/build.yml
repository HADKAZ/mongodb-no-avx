name: Build MongoDB without AVX

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mongo_version:
        description: 'MongoDB version to build (e.g. 7.0.28)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name == 'workflow_dispatch' && inputs.mongo_version || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    permissions:
      contents: read
      packages: write

    steps:
      - name: Determine MongoDB version
        id: version
        env:
          RAW: ${{ github.event_name == 'workflow_dispatch' && inputs.mongo_version || github.ref_name }}
        run: |
          VERSION="${RAW#v}"
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            echo "::error::'$RAW' is not a MongoDB version like 7.0.28 or v7.0.28"
            exit 1
          fi
          {
            echo "full=$VERSION"
            echo "minor=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            echo "major=${BASH_REMATCH[1]}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.full }}
            type=raw,value=${{ steps.version.outputs.minor }}
            type=raw,value=${{ steps.version.outputs.major }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MONGO_VERSION=${{ steps.version.outputs.full }}
            NUM_JOBS=4
          cache-from: type=gha
          cache-to: type=gha,mode=max
